name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 注意：package-lock.json 未纳入版本控制，故用 npm install 而非 npm ci
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck (types/*.d.ts 冒烟)
        run: npm run typecheck

      - name: Test
        run: npm test
